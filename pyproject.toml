[project]
name = "ord-ram-num"
version = "0.1.0"
description = "This project contains several Python scripts that help determine or estimate various ordered Ramsey numbers and cyclic Ramsey numbers."
authors = [ { name = "Nino Bašić" }, { name = "Ivan Damnjanović" }, { name = "Dragan Stevanović" }, { name = "Ivan Stošić" } ]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "rlgt[agents] (>=1.0.1,<2.0.0)"
]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "ord_ram_num", from = "src" }]

[tool.poetry.group.dev.dependencies]
black = "^25.9.0"
isort = "^7.0.0"

[tool.black]
line-length = 99
target-version = ['py37']

[tool.isort]
profile = "black"
lines_after_imports = 2