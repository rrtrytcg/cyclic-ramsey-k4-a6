[project]
name = "ord-ram-num"
version = "1.0.0"
description = "This project contains the source code together with some supplementary material for the research paper: N. Bašić, I. Damnjanović, D. Stevanović and I. Stošić, Some results on small ordered and cyclic Ramsey numbers, 2026, arXiv:2604.16188."
authors = [ { name = "Nino Bašić" }, { name = "Ivan Damnjanović" }, { name = "Dragan Stevanović" }, { name = "Ivan Stošić" } ]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "rlgt[agents] (>=1.0.1,<2.0.0)",
    "cython (>=3.2.4,<4.0.0)"
]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "*", from = "src" }]

[tool.poetry.group.dev.dependencies]
black = "^25.9.0"
isort = "^7.0.0"

[tool.black]
line-length = 99
target-version = ['py37']

[tool.isort]
profile = "black"
lines_after_imports = 2
